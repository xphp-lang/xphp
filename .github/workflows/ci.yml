name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch (e.g. when a PR gets a new push)
# so we don't pay for stale-commit mutation runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, tokenizer
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=never

  infection:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: phpunit
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with Xdebug for coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, tokenizer
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run Infection
        # --min-covered-msi=93 fails CI if mutation score drops below 93 (current baseline: 94%).
        # --threads=4 parallelizes mutant runs; safe on the 2-core ubuntu-latest runner.
        run: vendor/bin/infection --threads=4 --min-covered-msi=93 --no-progress

      - name: Upload Infection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-report
          path: |
            var/infection.log
            var/infection.html
          if-no-files-found: ignore
          retention-days: 14
