name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch (e.g. when a PR gets a new push)
# so we don't pay for stale-commit mutation runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, tokenizer
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPUnit
        run: make test/unit

  phpunit-lsp:
    name: PHPUnit (LSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, tokenizer
          coverage: none
          tools: composer:v2

      # The LSP package has its own composer.json under tools/lsp/ with a
      # path-repo pointing back at the repo root. Cache its deps separately
      # from the core install so a core-only change doesn't bust the LSP cache.
      - name: Install LSP dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: tools/lsp

      - name: Run PHPUnit (LSP)
        run: make test/lsp

  infection:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: phpunit
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with Xdebug for coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, tokenizer
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run Infection
        # --min-covered-msi=93 fails CI if mutation score drops below 93 (current baseline: 94%).
        # --threads=4 parallelizes mutant runs; safe on the 2-core ubuntu-latest runner.
        run: make test/mutation

      - name: Upload Infection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-report
          path: |
            var/infection.log
            var/infection.html
          if-no-files-found: ignore
          retention-days: 14

  infection-lsp:
    name: Mutation testing (LSP)
    runs-on: ubuntu-latest
    needs: phpunit-lsp
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with Xdebug for coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, tokenizer
          coverage: xdebug
          tools: composer:v2

      - name: Install LSP dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: tools/lsp

      - name: Run Infection (LSP)
        # `make test/lsp/mutation` lazily downloads infection.phar 0.33.1
        # into tools/lsp/var/ (PHAR sidesteps the composer dep conflict with
        # phpactor/language-server documented in tools/lsp/README.md). Runs
        # with --min-covered-msi=93; current baseline is 94%.
        run: make test/lsp/mutation

      - name: Upload Infection report (LSP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-lsp-report
          path: |
            tools/lsp/var/infection.log
            tools/lsp/var/infection.html
          if-no-files-found: ignore
          retention-days: 14
