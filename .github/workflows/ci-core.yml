name: Core CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch (e.g. when a PR gets a new push)
# so we don't pay for stale-commit mutation runs. The concurrency group is
# keyed on the workflow name + ref, so this is per-workflow — the LSP CI
# can run concurrently with this one without queueing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether this PR/push touches code that mutation testing covers.
  # Infection is expensive, so the `infection` job below runs only when src/
  # or test/ changed — a docs-only or config-only change skips it.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'

  phpunit:
    # 8.4 is the supported/default runtime and runs the full suite minus the
    # `php85` group; a dedicated 8.5 container runs only that group, which
    # covers syntax (e.g. the pipe operator `|>`) that the host-version
    # parser can only tokenize on PHP 8.5.
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            target: test/unit
          - php: '8.5'
            target: test/unit/php85
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring, tokenizer
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPUnit
        run: make ${{ matrix.target }}

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, tokenizer
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: make lint/phpstan

  phpstan-pass:
    # The `xphp check` PHPStan-integration tests (@group phpstan) shell out to a
    # real phpstan binary, so they're excluded from `make test/unit` and run here.
    # `composer install` provides vendor/bin/phpstan (a require-dev dependency).
    name: PHPStan pass (xphp check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, tokenizer
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run the PHPStan-pass tests
        run: make test/phpstan-pass

  check:
    # End-to-end self-test of the `xphp check` gate: runs the real bin/xphp
    # binary against the check fixtures and asserts the 0/1/2 exit contract.
    # The in-process CheckCommandTest can't observe the shipped binary's
    # process exit code or its rendered stdout, so this covers that gap.
    name: xphp check (self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, tokenizer
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run xphp check self-test
        run: make test/check

  infection:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Only after unit tests pass, and only when src/ or test/ changed
    # (see the `changes` job) — mutation is skipped for docs/config-only work.
    needs: [phpunit, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with Xdebug for coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, tokenizer
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run Infection
        # --min-covered-msi=95 fails CI if the mutation score drops below
        # the gate.  Threads=max parallelises mutant runs.
        run: make test/mutation

      - name: Upload Infection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-report
          path: |
            var/infection.log
            var/infection.html
          if-no-files-found: ignore
          retention-days: 14
