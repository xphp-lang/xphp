services:
  php:
    build:
      dockerfile: .docker/php.Dockerfile
    working_dir: /opt/app
    volumes:
      - ./:/opt/app
    environment:
      XDEBUG_MODE: coverage,develop

  # PHP 8.5 runtime for the `@group php85` tests. Run them with:
  #   docker compose run --rm php85 make test/unit/php85
  php85:
    build:
      dockerfile: .docker/php85.Dockerfile
    working_dir: /opt/app
    volumes:
      - ./:/opt/app

  xphp:
    extends:
      service: php
    entrypoint: [ "/opt/app/bin/xphp" ]

  # Node runtime for commit-message linting: the .githooks/commit-msg hook runs
  # commitlint through this service, so contributors need docker but no host
  # Node toolchain — and local linting uses the exact tool CI runs. One-shot:
  #   docker compose run --rm node npx commitlint --help
  node:
    image: node:24-alpine
    working_dir: /opt/app
    volumes:
      - ./:/opt/app
    command: [ "tail", "-f", "/dev/null" ]

volumes:
  composer_cache: ~
